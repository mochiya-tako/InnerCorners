name: Bug report
description: Report reproducible behavior or a safety problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. If pointer control becomes difficult, hold Option to pass through a barrier or press Control–Option–Command–Q to disable barriers and quit. Do not keep reproducing an unsafe state.
  - type: input
    id: version
    attributes:
      label: InnerCorners version and build
      placeholder: "0.12.0 Beta 1 (build 71)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Mac and macOS version
      placeholder: "Mac mini M4, macOS 27.0.1"
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Display layout
      description: Include display count, names, resolutions, scaling, and physical arrangement.
      placeholder: "Two displays, horizontal; left 1920×1080, right 2560×1080"
    validations:
      required: true
  - type: input
    id: pointing_device
    attributes:
      label: Pointing device
      placeholder: "Apple Magic Mouse, trackpad, or mouse model/polling rate if known"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Stop if further reproduction could make the pointer difficult to control.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or screenshots
      description: Optional. Remove personal information, application names, paths, and other sensitive data before posting.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety paths
      options:
        - label: I tested whether holding Option allowed passage, if it was safe to do so.
        - label: I tested whether Control–Option–Command–Q quit the app, if it was safe to do so.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private or sensitive information from this report.
          required: true
